name: pins

# Keeps every checked-in version pin on the latest upstream release: Crush,
# ttyd (with the two binary sums), the Home Assistant CLI (with the two asset
# digests) and the Alpine base images. The add-on version is bumped in the same
# commit, so Home Assistant offers the rebuild. A no-change week writes nothing.
# GitHub Actions SHAs are handled by Dependabot (dependabot.yml).
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  # ci.yml is re-run explicitly after the push: a commit pushed with the
  # workflow token does not trigger workflows on its own.
  actions: write

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh the pinned releases
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_pins.py | tee /tmp/pins.txt
          if git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "every pin is current - nothing to do"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          # the pin lines become the changelog bullet of the version bump
          note="$(paste -sd ';' - < /tmp/pins.txt)"
          echo "version=$(python3 .github/scripts/bump_version.py "$note")" >> "$GITHUB_OUTPUT"

      - name: Commit, push and re-run CI
        if: steps.pins.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charm-crush/Dockerfile charm-crush/build.yaml \
                  charm-crush/config.yaml charm-crush/CHANGELOG.md
          git commit -m "Refresh pinned builds to ${{ steps.pins.outputs.version }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          # Token pushes create no workflow runs, so validate this one by hand.
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
