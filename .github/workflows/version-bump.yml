name: version

# Home Assistant only offers an add-on update when config.yaml's `version`
# changes. Every push that changes what gets built therefore bumps the patch
# number and adds the changelog section the gate requires, in one commit.
# Pushed with the workflow token, so it does not start another CI run; a commit
# that already sets the version (a hand bump or this job's own commit) is left
# alone.
on:
  push:
    branches: [main]
  workflow_dispatch:
    paths:
      - 'charm-crush/rootfs/**'
      - 'charm-crush/Dockerfile'
      - 'charm-crush/build.yaml'
      - 'charm-crush/translations/**'
      - 'charm-crush/config.yaml'

# The only job that writes to the repository. Everything else stays read-only.
permissions:
  contents: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: the guard diffs HEAD against its parent. At depth 1
          # HEAD looks like a root commit, so every file (config.yaml included)
          # reads as added and the guard would always skip.
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit already set the version?
        id: guard
        run: |
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            if git diff HEAD^ HEAD -- charm-crush/config.yaml | grep -qE '^[+-]version:'; then
              echo "skip=1" >> "$GITHUB_OUTPUT"
              echo "this commit already changed the version - nothing to do"
            fi
          fi

      - name: Bump the version and add the changelog section
        if: steps.guard.outputs.skip != '1'
        env:
          # Pushed explicitly instead of persisting credentials in .git/config
          # (the repo's rule for every checkout in CI).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The bump logic is shared with update-pins.yml; it prints the version.
          new="$(python3 .github/scripts/bump_version.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charm-crush/config.yaml charm-crush/CHANGELOG.md
          git commit -m "Bump HASSCrush to $new"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
