name: CI

on:
  push:
    branches: [main]
    paths: ['charm-crush/**', 'tests/**', '.github/workflows/ci.yml', '.github/scripts/**']
  pull_request:
    paths: ['charm-crush/**', 'tests/**', '.github/workflows/ci.yml', '.github/scripts/**']
  workflow_dispatch:

# A newer push to the same ref supersedes the in-flight run: the older run's
# verdict is uninteresting (the code moved on) and QEMU builds are slow enough
# to make queueing them pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN: no job here writes to the repo, and an
# unset block falls back to the repo/org default (possibly read-write).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the version-recency gate needs full history (%ct per file);
          # the token is not used - push rights stay with the local runner
          fetch-depth: 0
          persist-credentials: false

      - name: Validate YAML (config, build, translations)
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import yaml
          for f in ('charm-crush/config.yaml', 'charm-crush/build.yaml', 'charm-crush/translations/en.yaml'):
              d = yaml.safe_load(open(f))
              print(f, 'OK')
          c = yaml.safe_load(open('charm-crush/config.yaml'))
          t = yaml.safe_load(open('charm-crush/translations/en.yaml'))
          missing_schema = [k for k in c['options'] if k not in (c.get('schema') or {})]
          undocumented = [k for k in c['options'] if k not in (t.get('configuration') or {})]
          assert not missing_schema, f'options missing schema entries: {missing_schema}'
          assert not undocumented, f'options missing translations: {undocumented}'
          print('schema + translations complete')
          EOF

      - name: Shellcheck run.sh + lib.sh
        run: |
          bash -n charm-crush/rootfs/run.sh && bash -n charm-crush/rootfs/lib.sh && echo 'bash -n OK (run.sh + lib.sh)'
          # -S error: only actual shellcheck ERRORS fail the step. The remaining
          # warn/info findings in these files are pre-existing style notes on
          # code paths that work (SC2086 etc.) - see the advisory report step;
          # fix findings at their occurrences, never with a global disable.
          shellcheck -S error charm-crush/rootfs/run.sh charm-crush/rootfs/lib.sh .github/scripts/check_changelog.sh

      - name: Full shellcheck report (advisory)
        continue-on-error: true
        run: shellcheck charm-crush/rootfs/run.sh charm-crush/rootfs/lib.sh || true

      - name: bats unit tests (lib.sh helpers)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          bats tests/

      - name: hadolint (Dockerfile)
        run: |
          HADOLINT_VERSION=2.12.0
          curl -fsSL --retry 5 -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          # verify against the release's per-asset .sha256 before running the
          # binary (this release has no checksums.txt; each asset has its own
          # <asset>.sha256 containing "<hash>  <asset>")
          curl -fsSL --retry 5 -o /tmp/hadolint.sha256 \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64.sha256"
          EXPECTED=$(awk '{print $1}' /tmp/hadolint.sha256)
          [ -n "$EXPECTED" ] || { echo 'no checksum entry for hadolint-Linux-x86_64'; exit 1; }
          echo "${EXPECTED}  /tmp/hadolint" | sha256sum -c - || exit 1
          chmod +x /tmp/hadolint
          # the .hadolint.yaml documents (and justifies) the three waived rules
          /tmp/hadolint --config charm-crush/.hadolint.yaml charm-crush/Dockerfile

      - name: actionlint (workflow)
        run: |
          ACTIONLINT_VERSION=1.7.7
          # upstream publishes actionlint_<ver>_checksums.txt (version-prefixed
          # name); same verify-before-run pattern as the hadolint step above
          curl -fsSL --retry 5 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o /tmp/actionlint-sums \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          WANT="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          EXPECTED=$(awk -v f="$WANT" '$2 == f {print $1; exit}' /tmp/actionlint-sums)
          [ -n "$EXPECTED" ] || { echo "no checksum entry for ${WANT}"; exit 1; }
          echo "${EXPECTED}  /tmp/actionlint.tar.gz" | sha256sum -c - || exit 1
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint && chmod +x /tmp/actionlint
          /tmp/actionlint -color

      - name: Version-bump recency gate (the 1.0.28/1.0.29 trap)
        run: |
          # Trap this gate encodes: 1.0.28/1.0.29 committed run.sh changes AFTER
          # the config.yaml version-bump commit and never bumped again. The
          # Supervisor compares the config.yaml version string against the
          # installed add-on's version - with the string unchanged it refuses
          # to update, so the newer run.sh was unreachable from the add-on
          # (invisible in CI, a stale image shipped silently).
          # Rule: run.sh / lib.sh / Dockerfile must not have a commit newer
          # than the last config.yaml commit. A legit code change therefore
          # bumps config.yaml last (same-release bump commit is fine: equal
          # timestamps pass). Translations/DOCS-only commits never touch these
          # files, so translations-only bumps naturally pass without a bump.
          cfg_ts=$(git log -1 --format=%ct -- charm-crush/config.yaml)
          [ -n "$cfg_ts" ] || { echo '::error::config.yaml has no commit - cannot run the recency gate'; exit 1; }
          rc=0
          for f in charm-crush/rootfs/run.sh charm-crush/rootfs/lib.sh charm-crush/Dockerfile; do
            f_ts=$(git log -1 --format=%ct -- "$f")
            if [ "$f_ts" -gt "$cfg_ts" ]; then
              echo "::error::${f} has a commit NEWER than the last config.yaml commit (the 1.0.28/29 trap: that change is unreachable - the Supervisor sees an unchanged version string and skips the update). Bump config.yaml's version again, or amend/rebase the change before the bump commit if the release has not shipped."
              rc=1
            fi
          done
          exit $rc

      - name: Changelog gate (CHANGELOG.md has [Unreleased] and the config.yaml version)
        run: |
          # The add-on's Changelog tab renders charm-crush/CHANGELOG.md. A
          # version bump must ship its release notes in the same change.
          # Local files only, no network. Unit-tested in tests/changelog_gate.bats.
          bash .github/scripts/check_changelog.sh

      - name: Official add-on validation (frenck action-app-linter)
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./charm-crush
        # Supplement to the completeness check above, not a replacement: this
        # runs the canonical hassio add-on lint rules (the community devtools
        # image ghcr.io/home-assistant/*-devtools was retired, and
        # frenck/action-addon was renamed action-app-linter in 2024).

      - name: Secret scan
        run: |
          # Nothing that looks like a real key, token or private (RFC 1918)
          # address may be committed anywhere. Scans EVERY tracked text file
          # (-I skips binaries such as the png icons), so Dockerfile, dotfiles,
          # *.bash helpers and this workflow are covered too. The patterns are
          # written so their own source text does not match them (bracketed
          # class / escaped dots), which is what lets .github be scanned.
          # RFC 5737 documentation ranges (192.0.2.0/24, 198.51.100.0/24,
          # 203.0.113.0/24) are not RFC 1918, so test fixtures using them pass.
          # The octet guard keeps version-like strings (1.10.0.0.1) out.
          PRIV='(^|[^0-9.])(10\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)'
          PAT="sk-ant-oa[t]|sk-or-[a-z0-9-]{20}|gho_[a-z0-9]{30}|${PRIV}"
          # One documented exception: the Supervisor ingress proxy address is a
          # fixed constant of Home Assistant itself (lib.sh INGRESS_ADDR), not
          # a deployment-specific host.
          if git ls-files -z | xargs -0 grep -InE -e "$PAT" | grep -vE '172\.30\.32\.2([^0-9]|$)'; then
            echo '::error::Secret- or private-address-looking strings found (listed above)'
            exit 1
          fi
          echo 'no secrets'

  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve BUILD_FROM from build.yaml
        id: buildfrom
        run: |
          arch=${{ matrix.arch }}
          # the base image is build.yaml's truth, not this workflow's
          from="$(sed -n "/^build_from:/,/^labels:/ s/^  ${arch}: *//p" charm-crush/build.yaml | sed 's/"//g')"
          if [ -z "$from" ]; then
            # loud fallback: pinned base of record before this was derived
            from=ghcr.io/home-assistant/${arch}-base:3.21
            echo "::warning::build.yaml has no build_from.${arch} entry - falling back to ${from}. Fix build.yaml."
          fi
          echo "from=${from}" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.arch }})
        env:
          # via env, not ${{ }} inside run: - the value is derived from
          # build.yaml contents, which a pull request controls
          BUILD_FROM: ${{ steps.buildfrom.outputs.from }}
        run: |
          arch=${{ matrix.arch }}
          case "$arch" in
            amd64) BUILD_ARCH=amd64; PLATFORM=linux/amd64 ;;
            aarch64) BUILD_ARCH=aarch64; PLATFORM=linux/arm64 ;;
          esac
          docker buildx build --platform "$PLATFORM" --load \
            --build-arg BUILD_FROM="$BUILD_FROM" \
            --build-arg BUILD_ARCH="$BUILD_ARCH" \
            --cache-from type=gha,mode=max,scope=build-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=build-${{ matrix.arch }} \
            -t "charm-crush:$arch" charm-crush/

      - name: Smoke test binaries
        run: |
          docker run --rm --entrypoint /bin/bash charm-crush:${{ matrix.arch }} -c '
            crush --version | grep -q . || { echo "crush broken"; exit 1; }
            ttyd --version | grep -q . || { echo "ttyd broken"; exit 1; }
            ha --help 2>&1 | grep -q . || { echo "ha broken"; exit 1; }
            bash -n /usr/local/bin/run.sh || { echo "run.sh broken"; exit 1; }
            echo "binaries OK"'

      - name: Boot-surface smoke test (third_party + mcp_servers)
        run: |
          # Boots the built image the way the Supervisor would: stubs the
          # /data/options.json the boot actually reads (third_party provider,
          # mem0, a hyphenated http entry, a stdio entry), waits for the
          # boot log markers, then asserts on the GENERATED crushrc - not on
          # the template - so the add-on's own surgery (remap, token plumbing)
          # is what is tested. Values are RFC 5737 doc addresses; no real
          # network is contacted (run.sh's network calls are optional,
          # fail-fast fetches with --max-time).
          work=$(mktemp -d)
          printf '%s\n' \
            '{"provider":"third_party",' \
            ' "third_party_base_url":"http://test.invalid:9000/v1",' \
            ' "third_party_api_key":"smoke-key-not-real",' \
            ' "touch_bar":true,' \
            ' "mcp_servers":[{"name":"mem0","url":"http://test.invalid:8300/mcp","token":"smoke-token-not-real"},' \
            ' {"name":"home-assistant","url":"http://test.invalid:8123/mcp","token":"smoke-ha-token-not-real"},' \
            ' {"name":"relay","command":"socat","args":["STDIO","TCP:192.0.2.5:3010"],"timeout":20}]}' \
            > "$work/options.json"
          mkdir -p "$work/data"
          cp "$work/options.json" "$work/data/options.json"
          docker run -d --name boot-smoke -e SUPERVISOR_TOKEN=smoke-supervisor-token \
            -v "$work/data:/data" charm-crush:${{ matrix.arch }}
          rc=0
          for _ in $(seq 1 240); do
            if docker logs boot-smoke 2>&1 | grep -q 'mcp_servers: 3 server(s) applied'; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' boot-smoke 2>/dev/null)" != true ]; then
              echo '::error::container exited before the boot marker appeared'; docker logs boot-smoke 2>&1; rc=1; break
            fi
            sleep 2
          done
          if [ "$rc" = 0 ]; then
            # NOTE: GitHub runs run-blocks under `set -e -o pipefail`, so every
            # asserted condition is an `if` - a plain `cmd || { rc=1; }` would
            # terminate the script on the FIRST failed check and skip the rest
            # plus the container cleanup below.
            docker logs boot-smoke 2>&1 | tee "$work/boot.log"
            crushrc=$(docker exec boot-smoke cat /homeassistant/.crushdata/config/crush/crushrc)
            fail() { echo "FAIL: $1"; rc=1; }
            # 1) provider remap landed in the generated rc
            if ! echo "$crushrc" | grep -q 'provider add openai-compat-3p'; then fail 'provider not remapped to openai-compat-3p'; fi
            if echo "$crushrc" | grep -q 'provider add ollama-cloud'; then fail 'ollama-cloud still registered'; fi
            if ! grep -q 'provider=third_party: models remapped' "$work/boot.log"; then fail 'remap log marker missing'; fi
            # 2) the mcp entry was applied with its auth header referencing the
            #    env token (double-quoted pattern has an escaped $ on purpose:
            #    the crushrc must reference the token var, not inline it)
            if ! echo "$crushrc" | grep -qF "mcp add mem0 --type http --url \"http://test.invalid:8300/mcp\""; then fail 'mem0 mcp entry not applied'; fi
            if ! echo "$crushrc" | grep -qF "Bearer \$MCP_TOKEN_mem0"; then fail 'token not referenced via MCP_TOKEN_'; fi
            # 2b) hyphenated name: the token var is the underscore form, and the
            #     rc must not carry the invalid $MCP_TOKEN_home-assistant
            if ! echo "$crushrc" | grep -qF "mcp add home-assistant --type http --url \"http://test.invalid:8123/mcp\""; then fail 'home-assistant mcp entry not applied'; fi
            if ! echo "$crushrc" | grep -qF "Bearer \$MCP_TOKEN_home_assistant"; then fail 'hyphenated name not mapped to MCP_TOKEN_home_assistant'; fi
            if echo "$crushrc" | grep -qF 'MCP_TOKEN_home-assistant'; then fail 'hyphenated token var left in crushrc'; fi
            # 2c) stdio entry: command, both args as separate tokens, timeout
            if ! echo "$crushrc" | grep -qE 'mcp add relay --type stdio --command "socat" --args STDIO --args TCP:192\.0\.2\.5:3010 --timeout 20'; then fail 'stdio relay entry not applied as expected'; fi
            # 3) the token/key must be REFERENCED via env, never INLINED, in
            #    both the generated rc and the boot log
            if echo "$crushrc" | grep -qF 'smoke-token-not-real'; then fail 'token inlined in crushrc'; fi
            if echo "$crushrc" | grep -qF 'smoke-key-not-real'; then fail 'third-party key inlined in crushrc'; fi
            if grep -qF 'smoke-token-not-real' "$work/boot.log"; then fail 'token leaked into the boot log'; fi
            if echo "$crushrc" | grep -qF 'smoke-ha-token-not-real'; then fail 'home-assistant token inlined in crushrc'; fi
            if grep -qF 'smoke-ha-token-not-real' "$work/boot.log"; then fail 'home-assistant token leaked into the boot log'; fi
            # 4) touch bar: the custom index page was built from the
            #    build-time-extracted ttyd client page (extraction failures
            #    degrade to a WARN line + plain terminal instead of failing)
            if grep -qE 'touch bar (assets missing|page injection failed)' "$work/boot.log"; then fail 'touch bar assets missing / extraction failed'; fi
            if grep -q 'touch bar on' "$work/boot.log"; then
              tb=$(docker exec boot-smoke cat /tmp/ttyd-touchbar.html)
              if ! echo "$tb" | grep -q 'window.__HASSBAR={"theme"'; then fail 'touch bar prelude not in the generated index'; fi
              if ! docker exec boot-smoke pgrep -f 'ttyd.*--index /tmp/ttyd-touchbar.html' >/dev/null; then fail 'ttyd is not running with the touch bar index'; fi
            fi
          fi
          docker rm -f boot-smoke >/dev/null 2>&1 || true
          exit $rc