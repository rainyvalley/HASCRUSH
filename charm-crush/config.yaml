name: HASSCrush
description: Charm Crush AI assistant inside Home Assistant — all your Ollama (or third-party) models at your fingertips, with optional MCP support for third-party tie-ins
version: "1.0.28"
slug: charm-crush
url: https://github.com/rainyvalley/HASCRUSH
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false   # s6-overlay must be pid 1 (init:true re-parents it -> "can only run as pid 1")
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:alpha-c-box   # bold boxed C (bigger-reading sidebar glyph)
panel_title: HASSCrush
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
# full_access/docker_api intentionally ABSENT (default false) - better HA security rating.
# If a crush task needs host/docker access, toggle "Protection mode" per-install in the UI.
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - addon_config:rw
  - backup:ro
options:
  provider: ollama
  third_party_base_url: ""
  third_party_api_key: ""
  local_ollama_url: ""      # e.g. http://<your-ollama-host>:11434/v1
  crush_config_url: ""   # optional: HTTP URL fetching your crushrc each start
  crush_large_model: "ollama-cloud/glm-5.3-flash"
  crush_small_model: "ollama-cloud/glm-5.3-flash"
  crush_deep_model: "ollama-cloud/glm-5.3"
  crush_reasoning_effort: "high"
  crush_discover_models: true   # merge each provider's full model catalog into the TUI picker
  ollama_key_url: ""     # optional: HTTP URL fetching OLLAMA_API_KEY=...
  disti_token: ""        # optional: X-Disti-Token header for token-gated secret-file fetches (crush disti)
  mcp_servers: ""         # ALL MCP servers incl. mem0 - optional JSON array; e.g. [{"name":"mem0","url":"http://<host>:8300/mcp","token_url":"http://<host>/mem0-mcp.token"}] or stdio {"name":"openscad","command":"docker","args":["..."],"timeout":20}
  ollama_api_key: ""
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: true
  auto_update_crush: true
environment:
  TERM: xterm-256color
schema:
  provider: list(ollama|third_party)
  third_party_base_url: str?
  third_party_api_key: str?
  local_ollama_url: str?
  crush_config_url: str?
  crush_large_model: str?
  crush_small_model: str?
  crush_deep_model: str?
  crush_reasoning_effort: list(low|high|max)?
  crush_discover_models: bool
  ollama_key_url: str?
  disti_token: str?
  mcp_servers: str?
  ollama_api_key: str?
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  auto_update_crush: bool