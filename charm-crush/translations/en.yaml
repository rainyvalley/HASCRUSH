name: HASSCrush

configuration:
  provider:
    name: LLM Provider
    description: >-
      ollama (default): models served by ollama.com and/or your LAN Ollama.
      third_party: any OpenAI-compatible API - then set its Base URL and API
      Key below; the default GLM models are remapped onto your provider.
  third_party_base_url:
    name: Third-Party Base URL
    description: >-
      Required when Provider = third_party. The OpenAI-compatible API base,
      e.g. https://api.openai.com/v1 or https://openrouter.ai/api/v1.
  third_party_api_key:
    name: Third-Party API Key
    description: >-
      Required when Provider = third_party. The API key for that endpoint.
  local_ollama_url:
    name: LAN Ollama URL
    description: >-
      Base URL of your local Ollama (OpenAI-compatible /v1). Used for the
      local/vision models when provider = ollama.
  crush_large_model:
    name: Default (Daily) Model
    description: >-
      Model registration id used as the daily default (provider/model form).
      Defaults to ollama-cloud/glm-5.3-flash. The picker in the TUI always
      shows every model in the config; restart the add-on to refresh choices.
  crush_small_model:
    name: Helper (Small) Model
    description: >-
      Model used for session summaries/titles. Defaults to ollama-cloud/glm-5.3-flash.
  crush_deep_model:
    name: Deep Reasoning Model
    description: >-
      Registered as a reasoning model for heavy tasks; switch to it via the
      TUI model picker. Defaults to ollama-cloud/glm-5.3.
  crush_reasoning_effort:
    name: Reasoning Effort (Daily Model)
    description: >-
      Effort for the daily model's thinking: low (off), high (model-decided
      depth), max (forced long). Default high.
  crush_config_url:
    name: Central crushrc Template URL
    description: >-
      Fetch the Crush config (rc) from a central HTTP template each startup.
      Points at your config server's crushrc.template; leave empty to use the
      built-in fallback config. The rc is real Bash - it resolves API keys from
      the add-on's environment.
  ollama_key_url:
    name: Ollama API Key URL
    description: >-
      Fetch the Ollama Cloud API key from your config server (plain OLLAMA_API_KEY=... file).
      Overrides a stale persisted key when the central copy changes. Ignored if
      the Ollama API Key option below is set directly.
  disti_token:
    name: Disti Download Token
    description: >-
      Optional download credential for token-gated secret files: a crush
      disti (nginx) can serve its token copies (mem0/vision/openscad) and
      ollama.key behind an X-Disti-Token header check. When set, the Key
      URL and every MCP token_url fetch send that header. It is a download
      credential only - NOT an MCP bearer token, and MCP access does not
      depend on it. Leave empty if your disti serves files without a gate.
  mcp_servers:
    name: MCP Servers (JSON, optional)
    description: >-
      ALL MCP servers, including mem0 - one JSON array; each entry is one
      server. HTTP form: {"name":"vision","url":"http://192.0.2.10:3011/mcp",
      "token_url":"http://192.0.2.10/vision-mcp.token"} ("token" instead of
      token_url also works; omit both for no auth header). Stdio form:
      {"name":"openscad","command":"docker","args":["run","--rm","-i",
      "--network","host","alpine/socat","STDIO","TCP:192.0.2.10:3010"],
      "timeout":20} - note the TCP bridge is token-gated: the client's FIRST
      stdin line must be the bridge token (mimic the bridge's auth-gate.sh;
      a bare socat relay now gets closed after ~1s), so stdio entries need a
      wrapper that prints the token before relaying. Every token belongs on
      its own entry - there are no
      separate token fields anymore. Leave empty (or omit mem0) to disable
      the memory MCP; empty list = template servers as-is. Entries replace
      only their own server's line. Changes apply on add-on restart.
  ollama_api_key:
    name: Ollama API Key
    description: >-
      Ollama Cloud API key (ollama.com). Takes priority over the key URL.
      Leave empty to use the key URL or a previously persisted key.
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
  terminal_theme:
    name: Terminal Theme
    description: >-
      Color theme for the web terminal. Dark or light.
  working_directory:
    name: Working Directory
    description: >-
      Where crush starts. Use /homeassistant for direct access to HA config files.
  session_persistence:
    name: Session Persistence
    description: >-
      tmux session survives browser refreshes and disconnects. Recommended.
  auto_update_crush:
    name: Auto-update Crush
    description: >-
      Check for a newer Crush release on each add-on start and install it
      (with rollback if the new binary fails its smoke test).

network:
  7681/tcp: Web Terminal (ttyd)