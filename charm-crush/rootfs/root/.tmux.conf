set -g history-limit 20000
# Disable alternate screen buffer to allow terminal scrollback
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
# Mouse support: wheel scrolling and clicks inside the TUI. While mouse is on,
# a plain drag goes to tmux/Crush instead of the browser's own text selection;
# hold Shift (Option on macOS) while dragging to select natively. The
# terminal_mouse add-on option (exported as HASSCRUSH_MOUSE) turns it off.
set -g mouse on
if-shell '[ "$HASSCRUSH_MOUSE" = off ]' 'set -g mouse off'
# Clipboard: let tmux copy-mode selections AND applications (Crush's own
# copy-on-select) reach the browser as OSC 52. The web client turns OSC 52
# into a real clipboard write (touchbar.js); without these lines tmux can drop
# the sequence before it gets there.
set -g set-clipboard on
set -as terminal-features ',xterm*:clipboard'
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
# Bind mouse wheel to scroll through history in copy mode
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# User overrides, loaded last so they win. This file lives in the Home Assistant
# config directory, so it survives restarts, rebuilds and reinstalls - unlike
# /root/.tmux.conf, which is part of the container image. -q ignores it when absent.
# Example: echo 'set -g mouse off' > /homeassistant/.crushdata/tmux.conf
source-file -q /homeassistant/.crushdata/tmux.conf